name: Linting

on:
  push:
    branches:
      - main
      - ci
    paths:
      - "**/*.py"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.py"

jobs:
  lint:
    name: Python Linting
    runs-on: ubuntu-20.04

    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
      - name: Setup Python
        uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # v2
        with:
          python-version: '3.6'
          architecture: 'x64'
      - name: Install Python packages
        run: |
          pip install --upgrade pip setuptools flake8
      - name: Run Python Lint Test
        run: ./.github/workflows/run-linting.sh